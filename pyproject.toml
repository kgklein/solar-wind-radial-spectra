[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-wind-radial-spectra"
version = "0.1.0"
description = "Native-cadence PSP solar-wind time-series loading and plotting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pyspedas",
    "xarray",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
solarwind-plot = "solarwind.plot:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
